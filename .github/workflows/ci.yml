name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image:
          - context: .
            suffix: ""
          - context: nginx
            suffix: "-nginx"

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: ghcr.io/londonaicentre/mesa-validate${{ matrix.image.suffix }}:latest
